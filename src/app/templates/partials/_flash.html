{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category if category in ['success', 'danger', 'warning', 'info'] else 'info' }}" role="alert">
        <span>{{ message }}</span>
        <button type="button" class="btn-close" onclick="this.parentElement.remove()" aria-label="Đóng"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
