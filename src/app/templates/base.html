<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LuxAuto Showroom — Hệ thống Phân phối Xe Sang Chính Hãng{% endblock %}</title>
  <meta name="description" content="{% block description %}Showroom phân phối siêu xe và xe sang chính hãng với quy đổi ngoại tệ trực tuyến, đặt cọc và đặt lịch lái thử.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/brands/porsche.svg') }}">
  <!-- Local Offline Fallback + Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-local.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='2') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% include 'partials/_navbar.html' %}

  <main class="pb-5">
    <div class="container mt-3">
      {% include 'partials/_flash.html' %}
    </div>
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/_footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
