<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/brands/default.svg') }}">
  <title>{% block title %}Solvang — Trải nghiệm và đặt mua xe thể thao 3D{% endblock %}</title>
  <meta name="description" content="{% block description %}Xem chi tiết 12 mẫu xe thể thao và xe điện thật với mô hình 3D glTF, đổi màu sơn ngoại thất trực tiếp và đặt lịch lái thử tại Quận 1.{% endblock %}">
  <meta property="og:title" content="{% block og_title %}Solvang — Trải nghiệm và đặt mua xe thể thao 3D{% endblock %}">
  <meta property="og:description" content="Xem chi tiết 12 mẫu xe thật với mô hình 3D glTF, đổi màu sơn ngoại thất trực tiếp và đặt lịch lái thử tại Quận 1.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ url_for('static', filename='img/cars/porsche-911-carrera/hero.jpg') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20261123light') }}">

  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link button-sm" href="#top">Chuyển đến nội dung chính</a>

  {% include 'partials/_navbar.html' %}

  <main id="top">
    {% include 'partials/_flash.html' %}
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/_footer.html' %}

  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script defer src="{{ url_for('static', filename='js/cinema.js', v='20261123b') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
